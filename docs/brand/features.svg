<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="270" viewBox="0 0 1440 270" role="img" aria-label="三项主要体验：横版推荐，遥控追剧，长剧选集">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22252c"/><stop offset="1" stop-color="#12151a"/></linearGradient></defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
    <rect width="466" height="270" rx="20" fill="url(#g)"/>
    <rect x="487" width="466" height="270" rx="20" fill="url(#g)"/>
    <rect x="974" width="466" height="270" rx="20" fill="url(#g)"/>
    <text x="32" y="61" fill="#d8bd90" font-size="19" letter-spacing="2">LANDSCAPE</text>
    <text x="32" y="126" fill="#f6f2ea" font-size="35" font-weight="500">横版推荐</text>
    <text x="32" y="180" fill="#b8b7b4" font-size="23">选择横屏优先推荐</text>
    <text x="32" y="218" fill="#b8b7b4" font-size="23">发现适合大屏的故事</text>
    <text x="519" y="61" fill="#d8bd90" font-size="19" letter-spacing="2">REMOTE FIRST</text>
    <text x="519" y="126" fill="#f6f2ea" font-size="35" font-weight="500">遥控追剧</text>
    <text x="519" y="180" fill="#b8b7b4" font-size="23">换剧、播放、收藏与续播</text>
    <text x="519" y="218" fill="#b8b7b4" font-size="23">用遥控器顺手完成</text>
    <text x="1006" y="61" fill="#d8bd90" font-size="19" letter-spacing="2">EPISODE PICKER</text>
    <text x="1006" y="126" fill="#f6f2ea" font-size="35" font-weight="500">长剧选集</text>
    <text x="1006" y="180" fill="#b8b7b4" font-size="23">分段浏览，输入集数定位</text>
    <text x="1006" y="218" fill="#b8b7b4" font-size="23">确认之后再切换播放</text>
  </g>
</svg>
