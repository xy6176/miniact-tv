  <defs>
    <radialGradient id="glow" cx="80%" cy="30%" r="75%"><stop stop-color="#76512e" stop-opacity=".48"/><stop offset="1" stop-color="#0c0e12" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1d5"/><stop offset=".5" stop-color="#e0bd82"/><stop offset="1" stop-color="#a7793c"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#343128"/><stop offset="1" stop-color="#13151b"/></linearGradient>
    <linearGradient id="ribbon"><stop stop-color="#d5b37d" stop-opacity="0"/><stop offset=".5" stop-color="#d5b37d" stop-opacity=".18"/><stop offset="1" stop-color="#d5b37d" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1440" height="520" rx="24" fill="#0c0e12"/>
  <rect width="1440" height="520" rx="24" fill="url(#glow)"/>
  <path d="M760 520 1215 0h125L885 520Z" fill="url(#ribbon)"/>
